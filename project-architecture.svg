<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Data Lakehouse Architecture</title>
  <desc id="desc">Sample architecture showing raw CSV files feeding Spark, stored in MinIO object storage with Iceberg catalog and queried by Trino.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe5b4"/>
      <stop offset="100%" stop-color="#ffcc70"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeefc"/>
      <stop offset="100%" stop-color="#badaf9"/>
    </linearGradient>
    <linearGradient id="sqlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff6ea"/>
      <stop offset="100%" stop-color="#bfe8d1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4d5a"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2d3d; }
      .section { font: 700 18px Arial, sans-serif; fill: #243b53; }
      .label { font: 600 16px Arial, sans-serif; fill: #243b53; }
      .small { font: 12px Arial, sans-serif; fill: #44576a; }
      .box { stroke: #3a4a5a; stroke-width: 2; rx: 16; }
      .arrow { stroke: #3f4d5a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" class="title">Data Lakehouse Architecture</text>

  <!-- Source Layer -->
  <text x="120" y="110" class="section">Source data</text>
  <rect x="50" y="140" width="220" height="120" class="box" fill="#f5efe6"/>
  <text x="160" y="195" text-anchor="middle" class="label">CSV / sample files</text>
  <text x="160" y="220" text-anchor="middle" class="small">orders.csv</text>
  <text x="160" y="238" text-anchor="middle" class="small">customers.csv</text>
  <text x="160" y="256" text-anchor="middle" class="small">products.csv, payments.csv, shipments.csv</text>

  <!-- Spark -->
  <text x="470" y="110" class="section">ETL + processing</text>
  <rect x="350" y="140" width="260" height="160" class="box" fill="url(#sparkGrad)"/>
  <text x="480" y="185" text-anchor="middle" class="label">Apache Spark</text>
  <text x="480" y="210" text-anchor="middle" class="small">Read raw CSVs</text>
  <text x="480" y="228" text-anchor="middle" class="small">Clean + cast types</text>
  <text x="480" y="246" text-anchor="middle" class="small">Build bronze → silver → gold</text>
  <text x="480" y="264" text-anchor="middle" class="small">Write Iceberg tables</text>

  <!-- Storage -->
  <text x="780" y="110" class="section">Storage + metadata</text>
  <rect x="700" y="140" width="220" height="160" class="box" fill="url(#lakeGrad)"/>
  <text x="810" y="185" text-anchor="middle" class="label">MinIO / S3</text>
  <text x="810" y="210" text-anchor="middle" class="small">Object storage</text>
  <text x="810" y="228" text-anchor="middle" class="small">Iceberg table data</text>
  <text x="810" y="246" text-anchor="middle" class="small">Warehouse bucket</text>

  <rect x="930" y="140" width="200" height="160" class="box" fill="#e7e4ff"/>
  <text x="1030" y="185" text-anchor="middle" class="label">Iceberg REST Catalog</text>
  <text x="1030" y="210" text-anchor="middle" class="small">Metadata layer</text>
  <text x="1030" y="228" text-anchor="middle" class="small">Schema + table state</text>
  <text x="1030" y="246" text-anchor="middle" class="small">Table discovery</text>

  <!-- SQL -->
  <text x="600" y="385" class="section">Analytics layer</text>
  <rect x="420" y="420" width="360" height="180" class="box" fill="url(#sqlGrad)"/>
  <text x="600" y="470" text-anchor="middle" class="label">Trino</text>
  <text x="600" y="495" text-anchor="middle" class="small">Query Iceberg tables</text>
  <text x="600" y="513" text-anchor="middle" class="small">Summaries / revenue / quality checks</text>
  <text x="600" y="531" text-anchor="middle" class="small">SQL dashboards and analytics</text>
  <text x="600" y="559" text-anchor="middle" class="small">Examples via Trino CLI / SQL clients</text>

  <!-- User -->
  <rect x="50" y="430" width="220" height="120" class="box" fill="#f3e8ff"/>
  <text x="160" y="485" text-anchor="middle" class="label">Analyst / developer</text>
  <text x="160" y="510" text-anchor="middle" class="small">Runs SQL queries</text>
  <text x="160" y="528" text-anchor="middle" class="small">Reviews KPI reports</text>

  <!-- Arrows -->
  <path d="M270 200 H350" class="arrow"/>
  <path d="M610 200 H700" class="arrow"/>
  <path d="M920 200 H930" class="arrow"/>
  <path d="M1030 300 L1030 380" class="arrow"/>
  <path d="M810 300 L810 420" class="arrow"/>
  <path d="M420 510 H270" class="arrow"/>
  <path d="M600 600 L600 660" class="arrow"/>

  <!-- bottom layer -->
  <rect x="470" y="620" width="260" height="40" class="box" fill="#eaf7ef"/>
  <text x="600" y="645" text-anchor="middle" class="label">Gold tables + operational monitoring</text>
</svg>
