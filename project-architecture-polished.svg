<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lakehouse Project Architecture</title>
  <desc id="desc">Polished architecture diagram showing CSV source files, Spark ETL, MinIO object storage, Iceberg metadata catalog, and Trino SQL analytics within a modern data lakehouse design.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6ac"/>
      <stop offset="100%" stop-color="#ffd580"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff7ec"/>
      <stop offset="100%" stop-color="#bfe8d3"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeeff"/>
      <stop offset="100%" stop-color="#bddbff"/>
    </linearGradient>
    <linearGradient id="catalogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e1ff"/>
      <stop offset="100%" stop-color="#cfc8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9aa9bb" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3b4d5f"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #1f2f3d; }
      .subtitle { font: 700 18px Arial, sans-serif; fill: #2d4054; }
      .label { font: 700 18px Arial, sans-serif; fill: #233446; }
      .small { font: 14px Arial, sans-serif; fill: #495c70; }
      .tiny { font: 12px Arial, sans-serif; fill: #53677d; }
      .box { stroke: #2c3e52; stroke-width: 2.2; rx: 18; }
      .arrow { stroke: #3c4f63; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" class="title">Data Lakehouse Architecture</text>

  <!-- Source -->
  <text x="180" y="110" class="subtitle">Source layer</text>
  <rect x="55" y="145" width="250" height="160" class="box" fill="#f2eadb" filter="url(#shadow)"/>
  <text x="180" y="190" text-anchor="middle" class="label">Sample CSV files</text>
  <text x="180" y="220" text-anchor="middle" class="small">orders.csv</text>
  <text x="180" y="242" text-anchor="middle" class="small">customers.csv</text>
  <text x="180" y="264" text-anchor="middle" class="small">products.csv</text>
  <text x="180" y="286" text-anchor="middle" class="small">payments.csv / shipments.csv</text>

  <!-- Spark -->
  <text x="530" y="110" class="subtitle">Transformation layer</text>
  <rect x="380" y="145" width="300" height="200" class="box" fill="url(#sparkGrad)" filter="url(#shadow)"/>
  <text x="530" y="190" text-anchor="middle" class="label">Apache Spark</text>
  <text x="530" y="220" text-anchor="middle" class="small">Load raw files</text>
  <text x="530" y="242" text-anchor="middle" class="small">Clean and normalize fields</text>
  <text x="530" y="264" text-anchor="middle" class="small">Create bronze → silver → gold</text>
  <text x="530" y="286" text-anchor="middle" class="small">Write to Iceberg tables</text>
  <text x="530" y="308" text-anchor="middle" class="small">Run quality checks</text>

  <!-- Storage -->
  <text x="920" y="110" class="subtitle">Storage + metadata</text>
  <rect x="785" y="145" width="245" height="160" class="box" fill="url(#storageGrad)" filter="url(#shadow)"/>
  <text x="907" y="190" text-anchor="middle" class="label">MinIO / S3</text>
  <text x="907" y="220" text-anchor="middle" class="small">Object storage</text>
  <text x="907" y="242" text-anchor="middle" class="small">Warehouse bucket</text>
  <text x="907" y="264" text-anchor="middle" class="small">Iceberg table files</text>

  <rect x="1060" y="145" width="250" height="160" class="box" fill="url(#catalogGrad)" filter="url(#shadow)"/>
  <text x="1185" y="190" text-anchor="middle" class="label">Iceberg REST Catalog</text>
  <text x="1185" y="220" text-anchor="middle" class="small">Schema metadata</text>
  <text x="1185" y="242" text-anchor="middle" class="small">Table definitions</text>
  <text x="1185" y="264" text-anchor="middle" class="small">Catalog + table discovery</text>

  <!-- SQL / Consuming Layer -->
  <text x="700" y="430" class="subtitle">Consumption layer</text>
  <rect x="430" y="470" width="540" height="205" class="box" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="700" y="520" text-anchor="middle" class="label">Trino</text>
  <text x="700" y="550" text-anchor="middle" class="small">Query Iceberg tables with SQL</text>
  <text x="700" y="575" text-anchor="middle" class="small">Daily revenue, monthly revenue, product performance</text>
  <text x="700" y="600" text-anchor="middle" class="small">Customer and shipment summaries</text>
  <text x="700" y="625" text-anchor="middle" class="small">Quality and pipeline monitoring views</text>

  <!-- User -->
  <rect x="70" y="500" width="250" height="140" class="box" fill="#f3e8ff" filter="url(#shadow)"/>
  <text x="195" y="550" text-anchor="middle" class="label">Analyst / developer</text>
  <text x="195" y="578" text-anchor="middle" class="small">Runs SQL queries</text>
  <text x="195" y="602" text-anchor="middle" class="small">Reviews KPIs and data health</text>

  <!-- Layers below -->
  <rect x="470" y="710" width="460" height="70" class="box" fill="#edf7ef" filter="url(#shadow)"/>
  <text x="700" y="750" text-anchor="middle" class="label">Bronze / Silver / Gold warehouse + monitoring dashboards</text>

  <!-- Arrows -->
  <path d="M305 225 H380" class="arrow"/>
  <path d="M680 225 H785" class="arrow"/>
  <path d="M1030 225 H1060" class="arrow"/>
  <path d="M907 305 L907 470" class="arrow"/>
  <path d="M1185 305 L1185 470" class="arrow"/>
  <path d="M430 575 H320" class="arrow"/>
  <path d="M700 675 L700 710" class="arrow"/>

  <!-- Small tag chips -->
  <rect x="640" y="120" width="120" height="30" fill="#fff3d8" stroke="#d9b25f" stroke-width="1.5" rx="10"/>
  <text x="700" y="139" text-anchor="middle" class="tiny">ETL pipeline</text>

  <rect x="705" y="430" width="140" height="28" fill="#edf7ef" stroke="#7aa489" stroke-width="1.5" rx="10"/>
  <text x="775" y="449" text-anchor="middle" class="tiny">Analytics SQL</text>
</svg>
