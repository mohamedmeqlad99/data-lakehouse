services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DOMAIN: minio
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      lakehouse:
        aliases:
          - warehouse.minio

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb -p local/warehouse;
      mc anonymous set none local/warehouse;
      echo 'warehouse bucket ready';
      "
    networks:
      - lakehouse
    restart: "no"

  rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: lakehouse-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      REST_PORT: 8181
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8181'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - lakehouse

  spark:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    container_name: lakehouse-spark
    depends_on:
      rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8888:8888"
      - "8080:8080"
      - "15002:15002"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/jobs:/home/iceberg/jobs:ro
      - ./sample-data:/home/iceberg/data:ro
      - ./sql:/home/iceberg/sql:ro
    networks:
      - lakehouse

  trino:
    image: trinodb/trino:455
    container_name: lakehouse-trino
    depends_on:
      rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    networks:
      - lakehouse

volumes:
  minio-data:

networks:
  lakehouse:
    name: lakehouse-net
